[project]
name = "datacon2025hack"
version = "0.1.0"
description = "Virtual screening pipeline for DYRK1A inhibitors (DataCon 2025)"
authors = [
    {name = "Team Квадрицепс"},
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "polars>=0.20.0",
    "numpy>=1.24.0",
    "rdkit>=2023.9.1",
    "chembl-webresource-client>=0.10.8",
    "jupyter>=1.0.0",
    "plotly>=5.15.0",
    "kaleido>=0.2.1", # For plotly image export
    "tqdm>=4.65.0",
    "requests>=2.31.0",
    "pyarrow>=14.0.0", # Required for polars I/O operations
    "polars-ds>=0.10.0",
    "mordred[full]>=1.2.0",
    "padelpy>=0.1.16",
    "scikit-learn>=1.7.0",
    "torch>=2.7.1",
    "torch-geometric>=2.5.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "transformers>=4.30.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
    "joblib>=1.3.0",
    "loguru>=0.7.3",
    "biopython>=1.85",
    "selfies>=2.2.0",
    "optuna>=4.4.0",
    "gputil>=1.4.0",
    "granian>=2.4.1",
    "flask>=3.1.1",
]

[project.urls]
Repository = "https://github.com/gulldan/datacon2025hack"

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "pre-commit>=3.4.0",
]

[tool.ruff]
lint.select = ["ALL"]

lint.ignore = [
    # --- This is a research pipeline of standalone scripts, not a library. ---
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",  # docstrings are not mandatory on every helper
    "D205", "D401", "D415",      # docstring formatting pedantry
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN206", "ANN401",  # gradual typing
    "T201",                      # print() is the output channel of a CLI step
    "PLR2004",                   # magic numbers are thresholds in cheminformatics code
    "PLC0415",                   # lazy imports keep heavy deps (torch, rdkit) out of import time
    "CPY001",                    # no per-file copyright headers
    "INP001",                    # steps are scripts, not packages
    # --- Scientific naming conventions that ruff reads as violations ---
    "N803", "N806",              # X_train, y_test, X are the conventional names in ML code
    "N812",                      # `import torch.nn.functional as F` is the documented alias
    "N811",                      # `from loguru import logger as LOGGER` and friends
    # --- Reproducibility: these must NOT be "fixed" ---
    "NPY002",                    # legacy np.random API: switching to Generator changes the
                                 # random stream and would invalidate the committed results
    # --- Style choices we accept ---
    "PTH100", "PTH103", "PTH107", "PTH110", "PTH112", "PTH118", "PTH119", "PTH120", "PTH123",
    "ERA001",                    # commented-out variants document alternatives tried
    "S101",                      # assert is fine outside production services
    "PD901",                     # `df` is a readable name here
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "C901",  # long analysis functions
    "FBT001", "FBT002", "FBT003",
    "TRY003", "EM101", "EM102", "TRY300", "TRY301", "TRY400",
    "G004", "BLE001", "DTZ005", "RET504", "SIM108", "B905", "UP035",
    "TD002", "TD003", "FIX002",
    "ISC001", "COM812",          # conflict with the formatter
    "RUF001", "RUF002", "RUF003", "RUF010", "RUF012",
    "E402",                      # scripts adjust sys.path before importing project modules
]

lint.unfixable = ["RUF003","RUF001","RUF010", "G004","TRY003","EM101","E712","ERA001", "RET504"]

line-length = 130

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    ".idea",
    "__pycahe__",
    "tests",
    "test"
]

# Assume Python 3.13.
target-version = "py313"
# fixable = ["Q"]


[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 5.
max-complexity = 50

[tool.ruff.lint.pylint]
max-branches = 50
max-statements = 150
max-args = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

# Use single quotes for non-triple-quoted strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
